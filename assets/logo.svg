<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">NotebookLM Code</title>
  <desc id="desc">A dark rounded square with an indigo notebook and pages motif.</desc>
  <rect width="128" height="128" rx="26" fill="#0B1020"/>
  <rect x="6" y="6" width="116" height="116" rx="21" fill="none" stroke="#6366F1" stroke-width="4"/>
  <!-- back page -->
  <rect x="34" y="28" width="52" height="72" rx="6" fill="#312E81"/>
  <!-- middle page -->
  <rect x="38" y="32" width="52" height="68" rx="5" fill="#4338CA"/>
  <!-- front page -->
  <rect x="42" y="36" width="52" height="64" rx="5" fill="#EEF2FF"/>
  <!-- binding spine accent -->
  <rect x="42" y="36" width="6" height="64" rx="2" fill="#818CF8"/>
  <!-- text lines -->
  <rect x="56" y="50" width="28" height="4" rx="2" fill="#6366F1"/>
  <rect x="56" y="60" width="24" height="4" rx="2" fill="#A5B4FC"/>
  <rect x="56" y="70" width="30" height="4" rx="2" fill="#A5B4FC"/>
  <rect x="56" y="80" width="18" height="4" rx="2" fill="#C7D2FE"/>
</svg>
